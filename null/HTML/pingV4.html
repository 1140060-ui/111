<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API & 網站測試器 - 完整修復版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            max-width: 650px;
            width: 100%;
        }

        .card h2 {
            color: #f8fafc;
            margin-bottom: 20px;
            font-size: 1.4rem;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* 效能統計面板 */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #334155;
            text-align: center;
        }

        .stat-item .label {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .stat-item .val {
            font-size: 1.1rem;
            font-weight: bold;
            color: #38bdf8;
        }

        /* 伺服器設定區塊 */
        .server-group {
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
        }

        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 600;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #64748b;
        }
        .dot.online { background-color: #34d399; box-shadow: 0 0 8px #34d399; }
        .dot.offline { background-color: #f87171; box-shadow: 0 0 8px #f87171; }

        .server-input-box {
            display: flex;
            gap: 8px;
        }

        .method-select {
            background: #1e293b;
            border: 1px solid #475569;
            color: #fbbf24;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
        }

        .url-input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #475569;
            color: #38bdf8;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-family: 'Fira Code', monospace;
        }

        .ping-btn {
            background: #334155;
            color: #f3f4f6;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .ping-btn:hover { background: #475569; }

        /* 進階設定 */
        details.advanced-group {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            margin-bottom: 16px;
            padding: 10px 16px;
        }

        summary {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        summary:hover { color: #38bdf8; }

        .advanced-content {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            color: #cbd5e1;
            cursor: pointer;
        }

        .field-label {
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 4px;
            display: block;
        }

        .text-area, .text-input {
            width: 100%;
            background: #1e293b;
            border: 1px solid #475569;
            color: #f3f4f6;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-family: 'Fira Code', monospace;
        }

        .text-area { resize: vertical; min-height: 70px; }

        /* 設定區塊 */
        .setting-group {
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .setting-group label {
            font-size: 0.9rem;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .num-input {
            background: #1e293b;
            border: 1px solid #475569;
            color: #38bdf8;
            padding: 4px 8px;
            border-radius: 6px;
            width: 60px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
        }

        /* Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #475569; transition: .3s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(20px); }

        .btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        .btn:hover { background: linear-gradient(135deg, #4f46e5, #4338ca); }
        .btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.6; }

        .spinner {
            width: 16px; height: 16px;
            border: 2px solid #ffffff; border-top: 2px solid transparent;
            border-radius: 50%; animation: spin 0.8s linear infinite; display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Log 區域 */
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            margin-bottom: 10px;
        }
        .log-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .action-btns { display: flex; gap: 8px; }
        .sm-btn {
            background: #334155;
            border: none;
            color: #cbd5e1;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        .sm-btn:hover { background: #475569; color: #fff; }

        .log-container {
            background-color: #090d16;
            color: #e2e8f0;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 0.85rem;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #1e293b;
            height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .log-item { line-height: 1.5; word-break: break-all; }
        .log-item .time { color: #64748b; }
        .log-item.info { color: #38bdf8; }
        .log-item.success { color: #34d399; }
        .log-item.error { color: #f87171; }
        .log-item.warning { color: #fbbf24; }
    </style>
</head>
<body>

    <div class="card">
        <h2>API & 網站測試器</h2>

        <!-- 效能統計面板 -->
        <div class="stats-bar">
            <div class="stat-item">
                <div class="label">總發送數</div>
                <div id="statTotal" class="val">0</div>
            </div>
            <div class="stat-item">
                <div class="label">成功率</div>
                <div id="statSuccessRate" class="val">100%</div>
            </div>
            <div class="stat-item">
                <div class="label">平均延遲</div>
                <div id="statAvgLatency" class="val">0 ms</div>
            </div>
        </div>

        <!-- 伺服器網址區塊 -->
        <div class="server-group">
            <div class="server-header">
                <span>TARGET URL & METHOD</span>
                <div class="status-badge">
                    <span id="statusDot" class="dot"></span>
                    <span id="statusText">未測試</span>
                </div>
            </div>
            <div class="server-input-box">
                <select id="httpMethod" class="method-select" onchange="toggleBodyInput()">
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="PATCH">PATCH</option>
                    <option value="DELETE">DELETE</option>
                </select>
                <input type="text" id="serverUrl" class="url-input" value="https://xsai0528.github.io/">
                <button class="ping-btn" onclick="testConnection()">測試連線</button>
            </div>
        </div>

        <!-- 進階設定 -->
        <details class="advanced-group" open>
            <summary>⚙️ 進階選項 (快取 / CORS / Headers)</summary>
            <div class="advanced-content">
                <div class="checkbox-group">
                    <label class="checkbox-label" title="自動處理隨機參數與 no-store，避開 Preflight Header 限制">
                        <input type="checkbox" id="disableCache" checked> ⚡ 強制停用快取 (Bust Cache)
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="useProxy"> 🌐 啟用 CORS 代理
                    </label>
                </div>
                <div>
                    <label class="field-label" for="authHeader">Authorization Header:</label>
                    <input type="text" id="authHeader" class="text-input" placeholder="Bearer your_token_here">
                </div>
                <div id="bodyGroup" style="opacity: 0.5;">
                    <label class="field-label" for="requestBody">Request Body (JSON 格式):</label>
                    <textarea id="requestBody" class="text-area" placeholder='{"key": "value"}'></textarea>
                </div>
            </div>
        </details>

        <!-- 批次設定 -->
        <div class="setting-group">
            <label for="batchInput">單次併發數量：</label>
            <div>
                <input type="number" id="batchInput" class="num-input" value="5" min="1" max="50"> 次
            </div>
        </div>

        <!-- 自動循環 -->
        <div class="setting-group">
            <label>
                每 <input type="number" id="intervalInput" class="num-input" value="5" min="1" max="60"> 秒自動循環
            </label>
            <label class="switch">
                <input type="checkbox" id="autoToggle" onchange="toggleAutoSend()">
                <span class="slider"></span>
            </label>
        </div>

        <button id="sendBtn" class="btn" onclick="triggerBatchSend()">
            <span id="spinner" class="spinner"></span>
            <span id="btnText">手動發送請求</span>
        </button>

        <!-- Log 區域 -->
        <div class="log-header">
            <span class="log-title">Console Log</span>
            <div class="action-btns">
                <button class="sm-btn" onclick="exportLog()">💾 下載 Log</button>
                <button class="sm-btn" onclick="clearLog()">清空 Log</button>
            </div>
        </div>
        <div id="logContainer" class="log-container">
            <div class="log-item info"><span class="time">[SYSTEM]</span> 系統就緒...</div>
        </div>
    </div>

    <script>
        let countdownTimer = null;
        let countdownValue = 0;
        let isSending = false;

        // 統計變數
        let totalRequests = 0;
        let successfulRequests = 0;
        let totalLatency = 0;

        function updateStats(success, duration) {
            totalRequests++;
            if (success) successfulRequests++;
            totalLatency += duration;

            document.getElementById('statTotal').innerText = totalRequests;
            const rate = totalRequests > 0 ? ((successfulRequests / totalRequests) * 100).toFixed(0) : 100;
            document.getElementById('statSuccessRate').innerText = `${rate}%`;
            const avg = totalRequests > 0 ? (totalLatency / totalRequests).toFixed(0) : 0;
            document.getElementById('statAvgLatency').innerText = `${avg} ms`;
        }

        function addLog(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];

            const logItem = document.createElement('div');
            logItem.className = `log-item ${type}`;
            logItem.innerHTML = `<span class="time">[${timeStr}]</span> ${message}`;

            logContainer.appendChild(logItem);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function clearLog() {
            document.getElementById('logContainer').innerHTML = '';
            totalRequests = 0;
            successfulRequests = 0;
            totalLatency = 0;
            document.getElementById('statTotal').innerText = '0';
            document.getElementById('statSuccessRate').innerText = '100%';
            document.getElementById('statAvgLatency').innerText = '0 ms';
            addLog('紀錄與統計資料已重置', 'info');
        }

        function exportLog() {
            const logs = Array.from(document.querySelectorAll('.log-item')).map(item => item.innerText).join('\n');
            const blob = new Blob([logs], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `api-test-log-${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function toggleBodyInput() {
            const method = document.getElementById('httpMethod').value;
            const bodyGroup = document.getElementById('bodyGroup');
            bodyGroup.style.opacity = (method === 'GET' || method === 'DELETE') ? '0.5' : '1';
        }

        // 產生最終請求 URL（正確處理 URL 物件與 CORS 代理）
        function getFinalUrl(rawUrl) {
            let finalUrl = rawUrl;
            const disableCache = document.getElementById('disableCache').checked;
            const useProxy = document.getElementById('useProxy').checked;

            if (disableCache) {
                try {
                    const urlObj = new URL(rawUrl);
                    urlObj.searchParams.set('_nocache', Date.now() + '_' + Math.random().toString(36).substring(2, 6));
                    finalUrl = urlObj.toString();
                } catch (e) {
                    const separator = finalUrl.includes('?') ? '&' : '?';
                    finalUrl += `${separator}_nocache=${Date.now()}`;
                }
            }

            if (useProxy) {
                finalUrl = 'https://corsproxy.io/?' + encodeURIComponent(finalUrl);
            }

            return finalUrl;
        }

        // 建構標準 Headers，防止引起 CORS 預檢失敗
        function buildHeaders() {
            const headers = {};
            const auth = document.getElementById('authHeader').value.trim();
            if (auth) headers['Authorization'] = auth;
            return headers;
        }

        // --- 測試連線 ---
        async function testConnection() {
            const rawUrl = document.getElementById('serverUrl').value.trim();
            const dot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const disableCache = document.getElementById('disableCache').checked;

            if (!rawUrl) {
                addLog('請輸入有效的網址！', 'error');
                return;
            }

            const targetUrl = getFinalUrl(rawUrl);
            addLog(`正在測試連線至: ${rawUrl} ...`, 'info');
            statusText.innerText = "連線中...";
            dot.className = "dot";

            const startTime = Date.now();

            try {
                const fetchOptions = {
                    method: 'GET',
                    headers: buildHeaders(),
                    cache: disableCache ? 'no-store' : 'default'
                };

                let response = await fetch(targetUrl, fetchOptions);
                const duration = Date.now() - startTime;

                if (response.ok || response.status < 500) {
                    dot.className = "dot online";
                    statusText.innerText = `已連線 (${duration}ms)`;
                    addLog(`連線成功！狀態碼: ${response.status}, 延遲: ${duration}ms`, 'success');
                } else {
                    dot.className = "dot offline";
                    statusText.innerText = `異常 (${response.status})`;
                    addLog(`回應異常，狀態碼: ${response.status}`, 'error');
                }
            } catch (error) {
                dot.className = "dot offline";
                statusText.innerText = "連線失敗";
                addLog(`連線失敗：${error.message}`, 'error');
            }
        }

        // --- 自動發送邏輯 ---
        function toggleAutoSend() {
            const isChecked = document.getElementById('autoToggle').checked;
            const intervalInput = document.getElementById('intervalInput');

            if (isChecked) {
                const seconds = parseInt(intervalInput.value) || 5;
                intervalInput.disabled = true;
                addLog(`自動循環已開啟（每 ${seconds} 秒觸發一次）`, 'warning');

                triggerBatchSend();
                startCountdown(seconds);
            } else {
                intervalInput.disabled = false;
                clearInterval(countdownTimer);
                addLog(`自動發送已關閉`, 'warning');
                document.getElementById('btnText').innerText = '手動發送請求';
            }
        }

        function startCountdown(seconds) {
            clearInterval(countdownTimer);
            countdownValue = seconds;

            countdownTimer = setInterval(() => {
                if (countdownValue > 0) countdownValue--;

                if (document.getElementById('autoToggle').checked) {
                    document.getElementById('btnText').innerText = isSending ? 
                        `處理中... (${countdownValue}s)` : `倒數中 (${countdownValue}s)...`;
                }

                if (countdownValue <= 0 && !isSending) {
                    countdownValue = seconds;
                    triggerBatchSend();
                }
            }, 1000);
        }

        // --- 單次請求 ---
        async function singleFetch(rawUrl, method, headers, payloadTemplate, index) {
            const startTime = Date.now();
            const targetUrl = getFinalUrl(rawUrl);
            const disableCache = document.getElementById('disableCache').checked;

            const fetchOptions = { 
                method: method, 
                headers: { ...headers },
                cache: disableCache ? 'no-store' : 'default'
            };

            if (method !== 'GET' && method !== 'DELETE' && payloadTemplate) {
                fetchOptions.headers['Content-Type'] = 'application/json';
                fetchOptions.body = payloadTemplate;
            }

            try {
                const response = await fetch(targetUrl, fetchOptions);
                const duration = Date.now() - startTime;
                const isOk = response.ok || response.status < 500;

                updateStats(isOk, duration);

                if (isOk) {
                    addLog(`[#${index}] ${method} 成功 (HTTP ${response.status}, ${duration}ms)`, 'success');
                    return true;
                } else {
                    addLog(`[#${index}] ${method} 失敗 (HTTP ${response.status}, ${duration}ms)`, 'error');
                    return false;
                }
            } catch (error) {
                const duration = Date.now() - startTime;
                updateStats(false, duration);
                addLog(`[#${index}] ${method} 異常 (${duration}ms): ${error.message}`, 'error');
                return false;
            }
        }

        async function triggerBatchSend() {
            if (isSending) return;

            const rawUrl = document.getElementById('serverUrl').value.trim();
            if (!rawUrl) {
                addLog('請輸入網址！', 'error');
                return;
            }

            const method = document.getElementById('httpMethod').value;
            const headers = buildHeaders();
            const bodyTemplate = document.getElementById('requestBody').value.trim();

            const btn = document.getElementById('sendBtn');
            const spinner = document.getElementById('spinner');
            const batchCount = parseInt(document.getElementById('batchInput').value) || 1;

            isSending = true;
            btn.disabled = true;
            spinner.style.display = 'inline-block';

            addLog(`🚀 批次發送 ${batchCount} 個 [${method}] 請求...`, 'info');

            const requests = [];
            for (let i = 1; i <= batchCount; i++) {
                requests.push(singleFetch(rawUrl, method, headers, bodyTemplate, i));
            }

            const results = await Promise.all(requests);
            const successCount = results.filter(res => res === true).length;

            addLog(`📊 批次完成：成功 ${successCount} / 失敗 ${batchCount - successCount}`, 'warning');

            isSending = false;
            btn.disabled = false;
            spinner.style.display = 'none';

            if (!document.getElementById('autoToggle').checked) {
                document.getElementById('btnText').innerText = '手動發送請求';
            }
        }
    </script>
</body>
</html>
